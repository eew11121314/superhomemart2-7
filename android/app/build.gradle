////ใช้ dhanaroj ทั้งหมด


plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.superhomemart2"  // กำหนด namespace ของแอป
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

defaultConfig {
    applicationId = "com.example.superhomemart2"
    minSdk = flutter.minSdkVersion
    targetSdk = flutter.targetSdkVersion
    versionCode 2  // เปลี่ยนเป็นเลขเวอร์ชันใหม่
    versionName "1.1"  // เปลี่ยนเป็นชื่อเวอร์ชันใหม่
}


   signingConfigs {
    release {
        storeFile file("C:/superhomemart2-7/my-release-key.jks")  // ใช้เส้นทางที่คุณสร้าง
        storePassword "dhanaroj"  // รหัสผ่านของ keystore ที่คุณตั้ง
        keyAlias "my-key-alias"  // ใช้ alias ที่ถูกต้อง
        keyPassword "dhanaroj"  // รหัสผ่านของคีย์ที่คุณตั้ง
    }
}

    buildTypes {
        release {
            signingConfig signingConfigs.release  // ใช้ signingConfig สำหรับการ build release
        }
    }
}


flutter {
    source = "../.."  // ใช้ path ของ Flutter SDK
}
